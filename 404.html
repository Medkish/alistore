<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | AlioStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Inter',system-ui,sans-serif;
  background:linear-gradient(160deg,#3d1c07,#241206);color:#f0d9b5;
  text-align:center;padding:24px}
.wrap{max-width:520px}
.logo{display:block;margin:0 auto 28px;width:80px;height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
h1{font-size:4rem;font-weight:800;color:#c0392b;line-height:1;margin-bottom:12px}
h2{font-size:1.3rem;font-weight:600;color:#e7c9a0;margin-bottom:8px}
p{line-height:1.6;color:#b5956a;margin-bottom:28px}
.btn{display:inline-block;padding:14px 32px;border-radius:8px;font-weight:700;
  text-decoration:none;font-size:.95rem;transition:background .2s,transform .15s}
.btn-home{background:#c0392b;color:#fff}
.btn-home:hover{background:#a93226;transform:translateY(-2px)}
@media(max-width:480px){h1{font-size:3rem}}
</style>
</head>
<body>
<div class="wrap">
  <img src="images/main-logo-nobg-cropped.png" alt="AlioStore" class="logo">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist, or has been moved. You can browse all our books from the homepage.</p>
  <a href="index.html" class="btn btn-home">Back to Home</a>
</div>
</body>
</html>
